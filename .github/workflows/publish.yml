name: Publish to npm and MCP Registry

# npm Trusted Publisher: S2thend / cursor-history-mcp / publish.yml.
# Leave the environment field empty and allow direct npm publish.
# See docs/publishing.md for the one-time npm package settings.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >=11.5.1 and Node.js >=22.14.0.
      - name: Install npm with trusted publishing support
        run: |
          npm install --global 'npm@^11.5.1'
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # npm exchanges the GitHub OIDC identity for short-lived credentials.
      # Provenance is generated automatically; no npm token secret is needed.
      - name: Publish to npm with OIDC
        run: npm publish --access public

      # Publish to MCP Registry
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Set version in server.json
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
